<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro Li&scaron;ka</title>
    <meta name="color-scheme" content="light dark">
    <style>
        :root {
            color-scheme: light dark;
            --background: #fff;
            --text: #111;
            --link: #000;
            --link-hover: #888;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #111;
                --text: #eee;
                --link: #fff;
                --link-hover: #ccc;
            }
        }

        body {
            background-color: var(--background);
            color: var(--text);
            font-family: monospace;
            margin: 10px;
            padding: 0;
            font-size: 1rem;
            line-height: 1.6;
        }

        h1 {
            font-size: 2.5rem;
        }

        div#content {
            margin: 50px auto;
            max-width: 450px;
        }

        a {
            color: var(--link);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--link-hover);
        }
    </style>
</head>
<body>
  <div id="content">
    <h1>Pedro Li&scaron;ka</h1>
    <p>
      I’m a Software Engineering Manager. You can find me on 
      <a href="https://www.linkedin.com/in/pedroliska">LinkedIn</a>.
    </p>
  </div>
</body>
</html>
